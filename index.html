<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Agent Dashboard</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #111827;
      color: #e5e7eb;
    }
    h1 {
      margin-top: 0;
      font-size: 20px;
    }
    .meta {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .meta-item {
      padding: 8px 12px;
      border-radius: 6px;
      background: #1f2937;
      font-size: 13px;
    }
    .label {
      color: #9ca3af;
      margin-right: 4px;
    }
    .value {
      font-weight: 600;
      color: #fbbf24;
    }
    #task {
      margin-bottom: 16px;
      font-size: 13px;
      color: #d1d5db;
    }
    #logs {
      background: #0b1120;
      border-radius: 6px;
      padding: 8px;
      max-height: 250px;
      overflow-y: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
      border: 1px solid #1f2937;
      margin-bottom: 16px;
    }
    .log-line {
      padding: 2px 0;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .timestamp {
      color: #6b7280;
      margin-right: 6px;
    }
    .type {
      color: #22c55e;
      margin-right: 6px;
    }
    .error .type {
      color: #f97316;
    }
    .warn .type {
      color: #eab308;
    }
    .chat-container {
      margin-top: 8px;
      padding: 12px;
      border-radius: 6px;
      background: #020617;
      border: 1px solid #1f2937;
    }
    .chat-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #e5e7eb;
    }
    .chat-input-row {
      display: flex;
      gap: 8px;
    }
    #task-input {
      flex: 1;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #4b5563;
      background: #020617;
      color: #e5e7eb;
      font-size: 13px;
    }
    #task-input::placeholder {
      color: #6b7280;
    }
    #send-btn {
      padding: 8px 14px;
      border-radius: 4px;
      border: none;
      background: #2563eb;
      color: #f9fafb;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    #send-btn:disabled {
      background: #4b5563;
      cursor: not-allowed;
    }
    #feedback {
      margin-top: 6px;
      font-size: 12px;
      min-height: 16px;
    }
    #feedback.ok {
      color: #22c55e;
    }
    #feedback.err {
      color: #f97316;
    }
  </style>
</head>
<body>
  <h1>Agent Live Dashboard</h1>
  <div class="meta">
    <div class="meta-item">
      <span class="label">Iteration</span>
      <span class="value" id="iteration">-</span>
    </div>
    <div class="meta-item">
      <span class="label">Stage</span>
      <span class="value" id="stage">-</span>
    </div>
  </div>
  <div id="task"></div>

  <div class="meta" style="margin-top: 8px;">
    <div class="meta-item" style="flex: 1 1 260px;">
      <span class="label">Runs</span>
      <span class="value">Recent</span>
      <div id="runs-list" style="margin-top: 6px; max-height: 140px; overflow-y: auto;"></div>
    </div>
    <div class="meta-item" style="flex: 2 1 360px;">
      <span class="label">Run Detail</span>
      <span class="value" id="run-detail-title">-</span>
      <div id="run-tabs" style="margin-top: 6px;">
        <button data-tab="progress" class="tab-btn active">Progress</button>
        <button data-tab="logs" class="tab-btn">Logs</button>
        <button data-tab="changes" class="tab-btn">Changes</button>
        <button data-tab="evidence" class="tab-btn">Evidence</button>
      </div>
    </div>
  </div>

  <div id="logs"></div>

  <div class="chat-container">
    <div class="chat-title">Submit a new task</div>
    <div class="chat-input-row">
      <input
        id="task-input"
        type="text"
        placeholder="Describe what you want the agent to do…"
      />
      <button id="send-btn">Send</button>
    </div>
    <div id="feedback"></div>
  </div>

  <script>
    async function fetchState() {
      try {
        const resp = await fetch("/state?_=" + Date.now());
        if (!resp.ok) {
          throw new Error("HTTP " + resp.status);
        }
        const data = await resp.json();
        renderState(data);
      } catch (e) {
        console.error("Failed to fetch state", e);
      }
    }

    function renderState(state) {
      document.getElementById("iteration").textContent =
        state.iteration != null ? state.iteration : "-";
      document.getElementById("stage").textContent =
        state.current_stage || "-";
      document.getElementById("task").textContent =
        state.task ? ("Task: " + state.task) : "";

      const logsEl = document.getElementById("logs");
      logsEl.innerHTML = "";
      const events = state.events_tail || [];
      events.forEach(ev => {
        const line = document.createElement("div");
        line.className = "log-line";

        const level = (ev.level || "").toLowerCase();
        if (level === "error") line.classList.add("error");
        if (level === "warn" || level === "warning") line.classList.add("warn");

        const ts = document.createElement("span");
        ts.className = "timestamp";
        ts.textContent = ev.timestamp || "";

        const type = document.createElement("span");
        type.className = "type";
        type.textContent = ev.type || "";

        const payload = document.createElement("span");
        payload.textContent = ev.payload ? JSON.stringify(ev.payload) : "";

        line.appendChild(ts);
        line.appendChild(type);
        line.appendChild(payload);
        logsEl.appendChild(line);
      });

      logsEl.scrollTop = logsEl.scrollHeight;
    }

    async function sendTask() {
      const input = document.getElementById("task-input");
      const btn = document.getElementById("send-btn");
      const feedback = document.getElementById("feedback");
      const task = input.value.trim();

      if (!task) {
        feedback.textContent = "Please enter a task.";
        feedback.className = "err";
        return;
      }

      btn.disabled = true;
      feedback.textContent = "Submitting task…";
      feedback.className = "";

      try {
        const resp = await fetch("/task", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ task }),
        });
        const data = await resp.json();
        if (!resp.ok) {
          throw new Error(data.error || ("HTTP " + resp.status));
        }
        input.value = "";
        feedback.textContent = "Task submitted.";
        feedback.className = "ok";
      } catch (e) {
        feedback.textContent = "Error submitting task: " + e.message;
        feedback.className = "err";
      } finally {
        btn.disabled = false;
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("send-btn").addEventListener("click", sendTask);
      document.getElementById("task-input").addEventListener("keydown", (ev) => {
        if (ev.key === "Enter" && !ev.shiftKey) {
          ev.preventDefault();
          sendTask();
        }
      });

      fetchState();
      setInterval(fetchState, 1000);
    });
  </script>
</body>
</html>
